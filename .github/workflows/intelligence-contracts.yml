name: Intelligence contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 contracts/intelligence/v1/verify.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'httpx>=0.27,<1' pytest jsonschema
      # Learning is a sibling package, so the intelligence path alone misses
      # its maturity, leakage, contamination and model-promotion regressions.
      - name: Test intelligence and learning boundaries
        run: python -m pytest cart_recovery/intelligence cart_recovery/learning -q -ra
