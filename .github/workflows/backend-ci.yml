name: backend-ci

# Runs the backend test suite + a bug-class lint on every PR and on pushes to
# main. (The repo's prior CI only built a Docker image on tags and ran no
# tests; that workflow was removed with the frontend in #56.)
#
# Dependencies are installed the way PRODUCTION installs them — CPU torch wheel
# then `requirements.txt` (mirrors backend/Dockerfile) — NOT via pyproject.toml /
# uv.lock, which are stale vs requirements.txt (they omit sentry-sdk, python-magic
# and gunicorn). requirements.txt is the deployed source of truth; the pyproject/
# uv.lock drift is tracked separately (see PR description).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Redis exercises the reconnect deadlock that fakeredis cannot model.
    services:
      redis:
        image: redis:8.2.9
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: af06_combined_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d af06_combined_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # Bug-class lint only (syntax errors, undefined names, broken
      # comparisons/asserts). Intentionally NOT the full ruff rule set: the
      # codebase has ~95 pre-existing style/hygiene findings (unused imports,
      # f-strings, etc.) that are out of scope here — widen the --select set in
      # a dedicated cleanup once those are addressed (#27).
      - name: Lint (ruff, bug-class baseline)
        # sweep.py / worker.py are top-level entrypoints outside app/ — include
        # them explicitly or an undefined name in a deploy entrypoint (F82) sails
        # through CI and only fails when Railway runs it.
        run: uvx ruff@0.15.14 check app tests sweep.py worker.py run.py --select E9,F63,F7,F82

      - name: Install dependencies (mirrors backend/Dockerfile + test tools)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio fakeredis

      - name: Run tests
        run: .venv/bin/pytest -q
        env:
          WAKARU_TEST_REDIS_URL: redis://localhost:6379

      - name: Install PostgreSQL tools for isolated knowledge lifecycle tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y postgresql
          pg_config --bindir

      - name: Verify combined integration and adaptive contracts
        working-directory: .
        run: |
          backend/.venv/bin/python -m pytest tests cart_recovery/intelligence cart_recovery/learning cart_recovery/adaptive/tests -q
          backend/.venv/bin/python contracts/intelligence/v1/verify.py
          backend/.venv/bin/python contracts/integrations/v1/verify.py
          backend/.venv/bin/python contracts/recovery/v2/verify.py
          backend/.venv/bin/python ops/runtime/verify_privacy.py
        env:
          AF06_TEST_DATABASE_URL: postgresql://postgres:fixture-only@127.0.0.1:5432/af06_combined_test

      # Run the opt-in signed HTTP/RQ/SQLite replay with a committed synthetic
      # request. The provider is httpx.MockTransport; no live key is needed.
      - name: Verify signed recovery replay and rollback
        working-directory: .
        run: backend/.venv/bin/pytest -q -ra backend/tests/test_completion_slice.py
        env:
          TYPESAFE_COMPLETION_REQUEST: backend/tests/fixtures/typesafe-completion-request.json
          TYPESAFE_SYNTHETIC_INSIGHT: ${{ runner.temp }}/typesafe-completion-insight.json

  lean-runtime:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.9
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Install core dependencies only
        run: |
          uv venv
          uv pip install -r backend/requirements-core.txt pytest fakeredis
      - name: Verify direct runtime without optional providers
        run: .venv/bin/python -m pytest backend/tests/test_lean_runtime.py backend/tests/test_combined_runtime.py backend/tests/test_combined_privacy_inventory.py -q
      - name: Build lean image
        run: docker build -f backend/Dockerfile.lean -t wakaru-lean:ci .
      - name: Verify retirement admission, inventory and quarantine with real Redis
        run: .venv/bin/python -m pytest ops/runtime/tests -q
        env:
          LEGACY_INVENTORY_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - name: Verify signed HTTP, Redis queue and real worker
        run: python ops/runtime/verify_container.py wakaru-lean:ci
