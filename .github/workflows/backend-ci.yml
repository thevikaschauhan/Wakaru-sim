name: backend-ci

# Runs the backend test suite + a bug-class lint on every PR and on pushes to
# main. (The repo's prior CI only built a Docker image on tags and ran no
# tests; that workflow was removed with the frontend in #56.)
#
# Dependencies are installed the way PRODUCTION installs them — CPU torch wheel
# then `requirements.txt` (mirrors backend/Dockerfile) — NOT via pyproject.toml /
# uv.lock, which are stale vs requirements.txt (they omit sentry-sdk, python-magic
# and gunicorn). requirements.txt is the deployed source of truth; the pyproject/
# uv.lock drift is tracked separately (see PR description).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real Redis so the gated scheduler suite (tests/test_sweep_scheduling.py,
    # incl. the serialized-duplicate / enqueue-fault tests) actually RUNS in CI
    # instead of skipping — a green run must exercise the sweep chain against a
    # live Redis, not fakeredis. Mapped to localhost:6379 (loopback, so the F10
    # flush guard permits its throwaway cleanup).
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (+ Python 3.12)
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # Bug-class lint only (syntax errors, undefined names, broken
      # comparisons/asserts). Intentionally NOT the full ruff rule set: the
      # codebase has ~95 pre-existing style/hygiene findings (unused imports,
      # f-strings, etc.) that are out of scope here — widen the --select set in
      # a dedicated cleanup once those are addressed (#27).
      - name: Lint (ruff, bug-class baseline)
        run: uvx ruff@0.15.14 check app tests --select E9,F63,F7,F82

      - name: Install dependencies (mirrors backend/Dockerfile + test tools)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -r requirements.txt
          uv pip install pytest pytest-asyncio fakeredis

      - name: Run tests
        env:
          # Un-skips tests/test_sweep_scheduling.py so the real-Redis scheduler
          # proof runs against the redis:7 service above.
          WAKARU_TEST_REDIS_URL: redis://localhost:6379/0
        run: .venv/bin/pytest -q
