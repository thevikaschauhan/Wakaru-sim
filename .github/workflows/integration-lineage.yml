name: C15 offline subject and source lineage
on:
  pull_request:
    paths: ['cart_recovery/intelligence/**', 'cart_recovery/lineage_client.py', 'cart_recovery/integration_service_auth.py', 'contracts/integrations/c16/**', 'scripts/integration_service_auth.py', 'scripts/*integration_lineage*', 'migrations/**', 'contracts/integrations/c15/**', '.github/workflows/integration-lineage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lineage-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_integration_lineage.py SQLiteTests -v
      - run: python -m pip install flask==3.1.3 httpx==0.28.1
      - run: python scripts/test_integration_lineage_service.py -v
