name: Integration foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 contracts/integrations/v1/verify.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==8.4.2 jsonschema[format-nongpl]==4.26.0 rfc8785==0.1.4 flask==3.1.3
      - run: python -m pytest tests/test_integration_contracts.py tests/test_integration_privacy.py tests/test_bounded_context.py tests/test_integration_service.py tests/test_integration_invalidation.py tests/test_integration_worker_health.py tests/test_integration_privacy_restore.py -q
